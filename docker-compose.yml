# Local dev environment. From the repo root:
#   docker compose up -d          # pull (first time) + start everything — no image build, ever
#   docker compose logs -f jupyter
#   docker compose down           # stop (add -v to also wipe DB data)
#
# JupyterLab is served automatically at http://localhost:8888/lab — no token.
# The `jupyter` service runs a pre-built, off-the-shelf Python+Node image
# (nikolaik/python-nodejs) unmodified — there is no Dockerfile and nothing to
# build, locally or in CI. Everything project-specific happens at container
# start via docker/entrypoint.sh: it (re)installs JS and Python dependencies
# from whatever is currently on disk, then runs `jlpm watch` (frontend) and
# `jupyter lab --autoreload` (backend) so both sides pick up source changes
# live, no restart needed.
#
# Database services are controlled via Docker Compose profiles.
# Enable/disable them in .env by editing COMPOSE_PROFILES.
# Example: COMPOSE_PROFILES=postgres,trino,starrocks
#
# See docker/README.md for details.

services:
  postgres:
    image: postgres:16
    ports:
      - 0.0.0.0:5432:5432
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-postgres:/docker-entrypoint-initdb.d
    profiles:
      - postgres

  trino:
    image: trinodb/trino:latest
    ports:
      - 0.0.0.0:8080:8080
    volumes:
      - ./docker/trino-catalog:/etc/trino/catalog
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - trino

  starrocks:
    image: starrocks/allin1-ubuntu:latest
    ports:
      - 0.0.0.0:9030:9030
      - 0.0.0.0:8030:8030
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-h", "127.0.0.1", "-P", "9030", "-e", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    volumes:
      - srdata:/opt/starrocks/fe/meta
    profiles:
      - starrocks

  starrocks-init:
    image: mariadb:latest
    depends_on:
      starrocks:
        condition: service_healthy
    volumes:
      - ./docker/init-starrocks:/init
    entrypoint: ["sh", "-c", "mariadb -h starrocks -P 9030 -u root < /init/01-sample-data.sql"]
    restart: "no"
    profiles:
      - starrocks

  vault:
    image: hashicorp/vault:1.17
    ports:
      - 0.0.0.0:8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devtoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    profiles:
      - vault

  jupyter:
    # Pre-built Python 3.12 + Node 22 image (Debian base, so git/build
    # tooling is already there) — pulled from Docker Hub, never built.
    # https://github.com/nikolaik/docker-python-nodejs
    image: nikolaik/python-nodejs:python3.12-nodejs22
    # The image's default user (`pn`) can't write the root-owned named
    # volume below without sudo, which isn't installed; running as root
    # sidesteps that entirely — fine for a disposable local dev container.
    user: root
    entrypoint: ["bash", "/workspace/docker/entrypoint.sh"]
    volumes:
      - .:/workspace
      # Named volume keeps node_modules on the container's own Linux
      # filesystem instead of the bind-mounted (and, on Windows/macOS,
      # cross-platform) workspace. jlpm populates it on first start and it
      # persists across `docker compose down` + `up`.
      - node_modules:/workspace/node_modules
      # Named volume keeps the whole Python install prefix (site-packages,
      # console scripts, ...) so `pip install` on later starts just
      # verifies already-installed packages instead of re-downloading and
      # rebuilding them (e.g. compiling psycopg2) from scratch every time.
      - python-local:/usr/local
      # Optional: point HOST_SSH_DIR (in .env) at your real ~/.ssh to use
      # your own keys for git inside the container. Defaults to an empty,
      # gitignored folder so this is a no-op out of the box.
      - ${HOST_SSH_DIR}:/root/.ssh:ro
    tmpfs:
      # `jupyter labextension develop --overwrite` re-symlinks this dir
      # into place every start anyway, so there's nothing worth persisting
      # here — and persisting it (as part of python-local above) caused
      # pip's editable-install dance to collide with a stale symlink on a
      # later `down`+`up`. tmpfs keeps it empty (and writable) on every
      # fresh container, shadowing that one path out of that volume.
      - /usr/local/share/jupyter/labextensions
    working_dir: /workspace
    ports:
      - 0.0.0.0:8888:8888
      - 0.0.0.0:9999:9999
    environment:
      VAULT_ENABLED: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_AUTH_METHOD: token
      VAULT_TOKEN: devtoken
      VAULT_KV_MOUNT: secret
      # Trino connection, auto-discovered by the explorer at server startup.
      # No _NAME (default catalog) is set, so it browses every catalog the
      # dev Trino coordinator exposes (postgresql, tpch, tpcds) rather than
      # being pinned to one. No password needed — the dev coordinator has
      # no authentication configured.
      DB_CONN_TRINO_TYPE: "7"
      DB_CONN_TRINO_HOST: trino
      DB_CONN_TRINO_PORT: "8080"
      DB_CONN_TRINO_USER: trino
      # PostgreSQL connection, auto-discovered the same way. No _NAME is
      # set either, so it connects to the `postgres` maintenance DB by
      # default and lets you browse every other DB testuser has CONNECT
      # on (just `testdb` in this dev setup).
      DB_CONN_POSTGRES_TYPE: "2"
      DB_CONN_POSTGRES_HOST: postgres
      DB_CONN_POSTGRES_PORT: "5432"
      DB_CONN_POSTGRES_USER: testuser
      DB_CONN_POSTGRES_PASS: testpass
      # StarRocks connection, auto-discovered the same way. No _NAME is set,
      # so it browses by catalog (this dev instance only has the built-in
      # default_catalog — no external catalog is configured). The dev
      # instance has no authentication configured, but PASS must still be
      # set (even empty) so the explorer treats the connection as having
      # stored credentials rather than prompting for a password.
      DB_CONN_STARROCKS_TYPE: "8"
      DB_CONN_STARROCKS_HOST: starrocks
      DB_CONN_STARROCKS_PORT: "9030"
      DB_CONN_STARROCKS_USER: root
      DB_CONN_STARROCKS_PASS: ""
    depends_on:
      vault:
        condition: service_started
        required: false

volumes:
  pgdata:
  srdata:
  node_modules:
  python-local:
